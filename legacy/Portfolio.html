  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

D-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"045ab295-2612-4554-8f97-e34cbd4f3fde\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"405b824b-d66b-44b7-a132-656c22db3a90\"><\u002Fscript>\n<style>\nhtml,body{margin:0;background:#F1F4F8;color:#0B1B33;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#2D5DD3}\na:hover{color:#0C3570}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:'Josefin Sans',sans-serif;background:#F1F4F8;color:#0B1B33;min-height:100vh;\">\n<div style=\"max-width:1440px;margin:0 auto;padding:0 clamp(20px,6vw,96px);\">\n\n<header data-screen-label=\"Header\" style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding:56px 0 64px;\">\n  <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-size:22px;\">\n    <span style=\"font-weight:600;\">Seu Nome<\u002Fspan>\n    <span style=\"color:#2D5DD3;\">Web · Mobile · Software<\u002Fspan>\n  <\u002Fdiv>\n  <nav style=\"display:flex;gap:28px;align-items:center;font-size:18px;flex-wrap:wrap;\">\n    <a href=\"mailto:contato@seunome.dev\" style=\"color:#2D5DD3;text-decoration:none;\">contato@seunome.dev<\u002Fa>\n    <a href=\"#projetos\" style=\"color:#0B1B33;text-decoration:none;\" style-hover=\"color:#2D5DD3\">Projetos<\u002Fa>\n    <a href=\"#velnox\" style=\"color:#0B1B33;text-decoration:none;\" style-hover=\"color:#2D5DD3\">VELNOX.IA<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<section data-screen-label=\"Hero\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(40px,7vw,112px);align-items:end;padding-bottom:96px;\">\n  <div style=\"aspect-ratio:4/5;width:100%;\">\n    <image-slot id=\"hero-foto\" shape=\"rect\" placeholder=\"Sua foto (retrato)\"><\u002Fimage-slot>\n  <\u002Fdiv>\n  <div style=\"padding-bottom:8px;\">\n    <h1 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(38px,4.4vw,64px);line-height:1.12;margin:0 0 36px;text-wrap:pretty;\">Software <strong style=\"font-weight:700;\">bem construído<\u002Fstrong>, do primeiro commit ao deploy.<\u002Fh1>\n    <p style=\"font-size:21px;line-height:1.6;margin:0 0 40px;max-width:600px;font-weight:300;\">Sou desenvolvedor web, mobile e de software. Ajudo empresas e equipes a tirar ideias do papel com aplicações rápidas, estáveis e fáceis de manter.<\u002Fp>\n    <a href=\"#contato\" style=\"display:inline-flex;align-items:center;background:#0C3570;color:#F1F4F8;text-decoration:none;border-radius:999px;padding:16px 30px 13px;font-size:17px;font-weight:600;letter-spacing:.02em;\" style-hover=\"background:#2D5DD3;color:#F1F4F8\">Agendar uma conversa<\u002Fa>\n    <p style=\"font-size:14px;margin:28px 0 0;\">Prefere por escrito? <a href=\"mailto:contato@seunome.dev\">Envie um e-mail<\u002Fa>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<hr style=\"border:0;border-top:1px solid #0B1B33;margin:0;\">\n\n<section data-screen-label=\"Serviços\" style=\"padding:112px 0;\">\n  <h2 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(34px,4vw,58px);line-height:1.18;margin:0 0 44px;max-width:1000px;text-wrap:pretty;\">Produtos digitais precisam funcionar em qualquer tela, <em style=\"font-weight:600;\">sem travar, sem gambiarras e sem surpresas no lançamento.<\u002Fem><\u002Fh2>\n  <div style=\"max-width:680px;font-size:20px;line-height:1.6;font-weight:300;\">\n    <p style=\"margin:0 0 28px;\">Trabalho com equipes e empresas de diferentes tamanhos para:<\u002Fp>\n    <ul style=\"margin:0 0 36px;padding-left:28px;display:flex;flex-direction:column;gap:16px;\">\n      <li><strong style=\"font-weight:600;\">Desenvolvimento web<\u002Fstrong> – sites e aplicações com foco em performance, acessibilidade e SEO.<\u002Fli>\n      <li><strong style=\"font-weight:600;\">Apps mobile<\u002Fstrong> – aplicativos iOS e Android com uma única base de código.<\u002Fli>\n      <li><strong style=\"font-weight:600;\">Software sob medida<\u002Fstrong> – sistemas internos, APIs e integrações que automatizam o seu dia a dia.<\u002Fli>\n    <\u002Ful>\n    <p style=\"margin:0 0 40px;\">Tem um projeto em mente? Vamos conversar <span style=\"color:#2D5DD3;\">↘<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n  <a href=\"#contato\" style=\"display:inline-flex;background:#0C3570;color:#F1F4F8;text-decoration:none;border-radius:999px;padding:16px 30px 13px;font-size:17px;font-weight:600;letter-spacing:.02em;\" style-hover=\"background:#2D5DD3;color:#F1F4F8\">Agendar uma conversa<\u002Fa>\n<\u002Fsection>\n\n<hr style=\"border:0;border-top:1px solid #0B1B33;margin:0;\">\n\n<section id=\"projetos\" data-screen-label=\"Projetos\" style=\"padding:112px 0 96px;\">\n  <h2 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(34px,3.6vw,52px);margin:0 0 20px;\">Projetos recentes<\u002Fh2>\n  <p style=\"font-size:20px;font-weight:300;margin:0 0 64px;\">Alguns dos produtos que desenvolvi recentemente.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:56px 44px;\">\n    <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"6\">\n      <article style=\"display:flex;flex-direction:column;\">\n        <div style=\"aspect-ratio:4/3;width:100%;background:#C8E3FF;margin-bottom:22px;position:relative;overflow:hidden;\">\n          <sc-if value=\"{{ p.hasVideo }}\" hint-placeholder-val=\"{{ false }}\">\n            <video src=\"{{ p.video }}\" autoplay=\"\" muted=\"\" loop=\"\" playsinline=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block;\"><\u002Fvideo>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ p.noVideo }}\" hint-placeholder-val=\"{{ true }}\">\n            <image-slot id=\"{{ p.slotId }}\" shape=\"rect\" placeholder=\"{{ p.placeholder }}\"><\u002Fimage-slot>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <span style=\"font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#2D5DD3;font-weight:600;margin-bottom:10px;\">{{ p.tag }}<\u002Fspan>\n        <h3 style=\"font-size:23px;font-weight:600;margin:0 0 10px;\">{{ p.title }}<\u002Fh3>\n        <p style=\"font-size:18px;line-height:1.55;font-weight:300;margin:0;\">{{ p.desc }}<\u002Fp>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:flex-end;margin-top:48px;\">\n    <a href=\"#\" style=\"font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#2D5DD3;text-decoration:none;font-weight:600;\">Ver todos os projetos<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showTestimonial }}\" hint-placeholder-val=\"{{ true }}\">\n  <hr style=\"border:0;border-top:1px solid #0B1B33;margin:0;\">\n  <section data-screen-label=\"Depoimento\" style=\"padding:140px 0;display:flex;flex-direction:column;align-items:center;text-align:center;\">\n    <div sc-camel-on-mouse-enter=\"{{ pause }}\" sc-camel-on-mouse-leave=\"{{ resume }}\" style=\"display:grid;width:100%;max-width:960px;\">\n      <sc-for list=\"{{ testimonials }}\" as=\"t\" hint-placeholder-count=\"1\">\n        <div style=\"grid-area:1/1;display:flex;flex-direction:column;align-items:center;transition:opacity .7s ease, transform .7s ease;opacity:{{ t.opacity }};transform:{{ t.shift }};pointer-events:{{ t.pe }};\">\n          <blockquote style=\"font-family:'Playfair Display',serif;font-size:clamp(28px,3vw,42px);line-height:1.35;margin:0 0 48px;text-wrap:balance;\">“{{ t.quote }}”<\u002Fblockquote>\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <div style=\"width:44px;height:44px;\"><image-slot id=\"{{ t.slotId }}\" shape=\"circle\" placeholder=\" \"><\u002Fimage-slot><\u002Fdiv>\n            <span style=\"font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#2D5DD3;font-weight:600;\">{{ t.author }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;margin-top:48px;\">\n      <sc-for list=\"{{ testimonials }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.go }}\" aria-label=\"Depoimento\" style=\"all:unset;cursor:pointer;height:8px;border-radius:999px;transition:width .4s, background .4s;width:{{ t.dotW }};background:{{ t.dotBg }};\"><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <hr style=\"border:0;border-top:1px solid #0B1B33;margin:0;\">\n<\u002Fsc-if>\n\n<section data-screen-label=\"Sobre\" style=\"padding:112px 0 0;\">\n  <div style=\"aspect-ratio:16/8;width:100%;margin-bottom:112px;\">\n    <image-slot id=\"sobre-foto-1\" shape=\"rect\" placeholder=\"Foto ampla – você trabalhando / ambiente\"><\u002Fimage-slot>\n  <\u002Fdiv>\n  <h2 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(34px,4vw,58px);line-height:1.18;margin:0 0 112px;max-width:1000px;text-wrap:pretty;\">Do protótipo à produção: tecnologia que resolve problemas reais e cresce junto com o seu negócio.<\u002Fh2>\n  <div style=\"border-top:1px solid #0B1B33;\">\n    <span style=\"display:inline-block;background:#0C3570;color:#F1F4F8;font-size:15px;font-weight:600;padding:14px 20px 11px;letter-spacing:.04em;\">Mais sobre mim<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px;padding:64px 0 96px;\">\n    <div><\u002Fdiv>\n    <div style=\"max-width:680px;font-size:21px;line-height:1.65;font-weight:300;display:flex;flex-direction:column;gap:24px;\">\n      <p style=\"margin:0;\">Desenvolvo software há mais de X anos, passando por startups, agências e empresas que precisavam de produtos digitais confiáveis.<\u002Fp>\n      <p style=\"margin:0;\">Nesse tempo aprendi que boa tecnologia é aquela que o usuário nem percebe: rápida, estável e simples de usar. Cuido da arquitetura, do código e da entrega.<\u002Fp>\n      <p style=\"margin:0;\">Trabalho de forma próxima e transparente, com entregas frequentes para que você acompanhe cada etapa do projeto.<\u002Fp>\n      <p style=\"margin:0;\">Se você procura um parceiro técnico para tirar seu projeto do papel, entre em contato.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px 36px;margin-top:20px;font-size:18px;font-weight:400;\">\n        <a href=\"#contato\" style=\"color:#0B1B33;text-decoration:none;display:flex;align-items:center;gap:10px;\" style-hover=\"color:#2D5DD3\"><span style=\"width:8px;height:8px;background:#2D5DD3;border-radius:50%;\"><\u002Fspan>Agendar conversa<\u002Fa>\n        <a href=\"mailto:contato@seunome.dev\" style=\"color:#0B1B33;text-decoration:none;display:flex;align-items:center;gap:10px;\" style-hover=\"color:#2D5DD3\"><span style=\"width:8px;height:8px;background:#2D5DD3;border-radius:50%;\"><\u002Fspan>Enviar e-mail<\u002Fa>\n        <a href=\"#\" style=\"color:#0B1B33;text-decoration:none;display:flex;align-items:center;gap:10px;\" style-hover=\"color:#2D5DD3\"><span style=\"width:8px;height:8px;background:#2D5DD3;border-radius:50%;\"><\u002Fspan>LinkedIn<\u002Fa>\n        <a href=\"#\" style=\"color:#0B1B33;text-decoration:none;display:flex;align-items:center;gap:10px;\" style-hover=\"color:#2D5DD3\"><span style=\"width:8px;height:8px;background:#2D5DD3;border-radius:50%;\"><\u002Fspan>GitHub<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"aspect-ratio:16/8;width:100%;\">\n    <image-slot id=\"sobre-foto-2\" shape=\"rect\" placeholder=\"Foto ou vídeo – bastidores / equipe\"><\u002Fimage-slot>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"velnox\" data-screen-label=\"VELNOX.IA\" style=\"margin-top:112px;background:#0C3570;color:#F1F4F8;padding:clamp(48px,6vw,88px) clamp(24px,6vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:40px clamp(40px,6vw,96px);align-items:center;\">\n  <div>\n    <span style=\"display:block;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#93C2FF;font-weight:600;margin-bottom:24px;\">Fundador<\u002Fspan>\n    <h2 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(40px,5vw,72px);line-height:1.08;margin:0 0 20px;\">VELNOX.IA<\u002Fh2>\n    <p style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(22px,2.2vw,30px);color:#C8E3FF;margin:0;\">“A velocidade nunca dorme.”<\u002Fp>\n  <\u002Fdiv>\n  <div>\n    <p style=\"font-size:20px;line-height:1.6;font-weight:300;margin:0 0 36px;max-width:560px;\">Desenvolvimento web de alta performance. Transformamos ideias em plataformas digitais que impulsionam o seu negócio.<\u002Fp>\n    <a href=\"https://www.velnoxia.com.br\" target=\"_blank\" style=\"display:inline-flex;background:#F1F4F8;color:#0C3570;text-decoration:none;border-radius:999px;padding:16px 30px 13px;font-size:17px;font-weight:600;letter-spacing:.02em;\" style-hover=\"background:#C8E3FF;color:#0C3570\">Conhecer a VELNOX.IA ↗<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showFaq }}\" hint-placeholder-val=\"{{ true }}\">\n  <section data-screen-label=\"FAQ\" style=\"padding:112px 0 0;\">\n    <h2 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(34px,3.6vw,52px);margin:0 0 48px;\">Perguntas frequentes<\u002Fh2>\n    <div style=\"border-top:1px solid #0B1B33;\">\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <div style=\"border-bottom:1px solid #0B1B33;\">\n          <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;gap:24px;width:100%;padding:32px 20px 28px;font-family:'Josefin Sans',sans-serif;font-size:20px;color:#0B1B33;box-sizing:border-box;\" style-hover=\"color:#2D5DD3\">\n            <span style=\"display:inline-block;transition:transform .2s;transform:{{ f.rot }};font-size:22px;line-height:1;\">›<\u002Fspan>\n            <span>{{ f.q }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;padding:0 20px 32px 58px;font-size:18px;line-height:1.6;font-weight:300;max-width:820px;\">{{ f.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"text-align:right;font-size:14px;margin:20px 0 0;\">Ficou alguma dúvida? <a href=\"mailto:contato@seunome.dev\">Envie um e-mail<\u002Fa><\u002Fp>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<section id=\"contato\" data-screen-label=\"Contato\" style=\"padding:140px 0 96px;\">\n  <h2 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(34px,3.6vw,52px);margin:0 0 40px;\">Tem uma ideia para tirar do papel?<\u002Fh2>\n  <p style=\"font-size:20px;line-height:1.6;font-weight:300;margin:0 0 40px;max-width:660px;\">Conte um pouco sobre o seu projeto. Podemos marcar uma conversa rápida por vídeo, sem compromisso, ou seguir por e-mail.<\u002Fp>\n  <a href=\"#\" style=\"display:inline-flex;background:#0C3570;color:#F1F4F8;text-decoration:none;border-radius:999px;padding:16px 30px 13px;font-size:17px;font-weight:600;letter-spacing:.02em;\" style-hover=\"background:#2D5DD3;color:#F1F4F8\">Agendar uma conversa gratuita<\u002Fa>\n  <p style=\"font-size:14px;margin:28px 0 0;\">Prefere por escrito? <a href=\"mailto:contato@seunome.dev\">Envie um e-mail<\u002Fa>.<\u002Fp>\n<\u002Fsection>\n\n<hr style=\"border:0;border-top:1px solid #0B1B33;margin:0;\">\n\n<footer data-screen-label=\"Rodapé\" style=\"padding:72px 0 48px;\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:48px;margin-bottom:72px;\">\n    <div style=\"grid-column:span 2;min-width:0;\">\n      <div style=\"font-size:24px;font-weight:600;margin-bottom:16px;\">Seu Nome <span style=\"color:#2D5DD3;font-weight:400;\">↘<\u002Fspan><\u002Fdiv>\n      <p style=\"font-size:19px;font-weight:300;margin:0;\">Desenvolvedor web, mobile e de software.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#2D5DD3;font-weight:700;margin-bottom:22px;\">Links<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;font-size:19px;\">\n        <a href=\"#\" style=\"color:#0B1B33;text-decoration:none;\" style-hover=\"color:#2D5DD3\">Início<\u002Fa>\n        <a href=\"#projetos\" style=\"color:#0B1B33;text-decoration:none;\" style-hover=\"color:#2D5DD3\">Projetos<\u002Fa>\n        <a href=\"mailto:contato@seunome.dev\" style=\"color:#0B1B33;text-decoration:none;\" style-hover=\"color:#2D5DD3\">E-mail<\u002Fa>\n        <a href=\"#\" style=\"color:#0B1B33;text-decoration:none;\" style-hover=\"color:#2D5DD3\">LinkedIn<\u002Fa>\n        <a href=\"#\" style=\"color:#0B1B33;text-decoration:none;\" style-hover=\"color:#2D5DD3\">GitHub<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;background:#0C3570;color:#C8E3FF;border-radius:999px;padding:16px 28px 13px;font-size:14px;letter-spacing:.03em;\">\n    <span>© 2026 Seu Nome – Feito com café e TypeScript<\u002Fspan>\n    <span style=\"display:flex;gap:20px;\"><span>Privacidade<\u002Fspan><span>Brasil<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showTestimonial&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showFaq&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: -1, t: 0 };\n  paused = false;\n  testimonialData = [\n    ['Entregou um aplicativo complexo no prazo, com código limpo e uma comunicação impecável durante todo o projeto.', 'Nome do Cliente – Empresa'],\n    ['Nosso site ficou muito mais rápido e as vendas online cresceram logo no primeiro mês.', 'Nome do Cliente – Empresa'],\n    ['Transformou nossas planilhas em um sistema simples que toda a equipe usa todos os dias.', 'Nome do Cliente – Empresa'],\n    ['Profissional atento aos detalhes, sempre propondo soluções antes mesmo de surgirem os problemas.', 'Nome do Cliente – Empresa']\n  ];\n  componentDidMount() {\n    this.timer = setInterval(() => {\n      if (!this.paused) this.setState(s => ({ t: (s.t + 1) % this.testimonialData.length }));\n    }, 5000);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  renderVals() {\n    const testimonials = this.testimonialData.map(([quote, author], i) => {\n      const on = this.state.t === i;\n      return {\n        quote, author, slotId: 'depo-avatar-' + (i + 1),\n        opacity: on ? 1 : 0, shift: on ? 'translateY(0)' : 'translateY(12px)', pe: on ? 'auto' : 'none',\n        dotW: on ? '32px' : '8px', dotBg: on ? '#0C3570' : '#93C2FF',\n        go: () => this.setState({ t: i })\n      };\n    });\n    const projects = [\n      { tag: 'Web', title: 'Plataforma de E-commerce', desc: 'Loja virtual com checkout próprio, painel administrativo e integração com meios de pagamento.' },\n      { tag: 'Mobile', title: 'App de Agendamentos', desc: 'Aplicativo iOS e Android para clínicas, com lembretes por notificação e pagamento no app.' },\n      { tag: 'Software', title: 'Sistema de Gestão Interna', desc: 'ERP sob medida que substituiu planilhas e automatizou o controle de estoque e pedidos.' },\n      { tag: 'Web', title: 'Dashboard de Métricas', desc: 'Painel em tempo real que reúne dados de vendas e marketing em uma única tela.' },\n      { tag: 'Mobile', title: 'App de Delivery', desc: 'Rastreamento de pedidos ao vivo para clientes, entregadores e restaurantes.' },\n      { tag: 'Software', title: 'API de Integrações', desc: 'Serviço que conecta sistemas legados a plataformas modernas com segurança e escala.' }\n    ].map((p, i) => {\n      const video = p.video || '';\n      return { ...p, video, hasVideo: !!video, noVideo: !video, slotId: 'projeto-' + (i + 1), placeholder: 'Imagem ou vídeo – ' + p.title };\n    });\n    const faqData = [\n      ['Quais tecnologias você usa?', 'Trabalho principalmente com React, Next.js, React Native, Node.js e TypeScript, mas escolho a stack de acordo com a necessidade de cada projeto.'],\n      ['Quanto tempo leva para desenvolver um projeto?', 'Depende do escopo. Um site leva algumas semanas; um aplicativo completo pode levar alguns meses. Após a primeira conversa envio um cronograma detalhado.'],\n      ['Você desenvolve para iOS e Android?', 'Sim. Uso desenvolvimento multiplataforma para entregar nos dois sistemas com uma única base de código, reduzindo custo e prazo.'],\n      ['Você faz manutenção depois da entrega?', 'Sim, ofereço planos de suporte e evolução contínua para manter o produto atualizado e seguro.'],\n      ['Quem cuida do design?', 'Posso trabalhar a partir do design da sua equipe ou indicar parceiros de UI/UX para criar a interface do zero.']\n    ];\n    const faqs = faqData.map(([q, a], i) => {\n      const open = this.state.open === i;\n      return { q, a, open, rot: open ? 'rotate(90deg)' : 'rotate(0deg)', toggle: () => this.setState({ open: open ? -1 : i }) };\n    });\n    return {\n      projects, faqs, testimonials,\n      pause: () => { this.paused = true; },\n      resume: () => { this.paused = false; },\n      showTestimonial: this.props.showTestimonial ?? true,\n      showFaq: this.props.showFaq ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
